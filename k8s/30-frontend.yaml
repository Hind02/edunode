apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: edunode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # A remplacer par le tag du dernier build Jenkins reussi
          # (build effectue APRES l'ajout de nginx.conf)
          image: hind02/edunode-frontend:36
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
---
# Seul service expose a l'exterieur du cluster.
# NodePort : le port 30080 de la VM redirige vers le port 80 des pods frontend.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: edunode
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
