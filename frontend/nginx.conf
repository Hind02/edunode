server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Les appels API du navigateur (/api/...) sont relayes vers le backend.
    # "backend" est le nom du service : dans docker-compose comme dans Kubernetes.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Toutes les autres URLs renvoient l'application Angular (routing cote navigateur)
    location / {
        try_files $uri $uri/ /index.html;
    }
}